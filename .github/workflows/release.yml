name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tag "v1.2.0" -> version "1.2.0", and point "download" at this release's zip
      - name: Stamp version and download URL
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DOWNLOAD="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/module.zip"
          jq --arg v "$VERSION" --arg dl "$DOWNLOAD" '.version = $v | .download = $dl' module.json > tmp.json
          mv tmp.json module.json

      # module.json must sit at the root of the zip
      - name: Build zip
        run: zip -r module.zip module.json README.md scripts styles

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
